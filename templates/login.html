<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — CloudAudit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #161b22; border-bottom: 1px solid #21262d; padding: 20px 40px; display: flex; align-items: center; gap: 12px; }
        .header a { color: #58a6ff; font-size: 24px; text-decoration: none; font-weight: 700; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
        .card h2 { color: #e6edf3; font-size: 24px; margin-bottom: 8px; }
        .card p { color: #8b949e; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #58a6ff; }
        .btn { width: 100%; padding: 12px; background: #1f6feb; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #388bfd; }
        .divider { text-align: center; margin: 20px 0; color: #8b949e; font-size: 13px; }
        .link-btn { display: block; text-align: center; color: #58a6ff; font-size: 14px; text-decoration: none; }
        .link-btn:hover { text-decoration: underline; }
        .error { background: #3a1a1a; border: 1px solid #f85149; border-radius: 6px; padding: 10px 14px; color: #f85149; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/">☁️ CloudAudit</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>Giriş Yap</h2>
            <p>Hesabına giriş yap</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="ornek@email.com" required />
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" name="password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn">Giriş Yap</button>
            </form>

            <div class="divider">veya</div>
            <a href="/register" class="link-btn">Hesabın yok mu? Kayıt ol</a>
        </div>
    </div>
</body>
</html>

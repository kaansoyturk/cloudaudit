<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudAudit — Bulut Güvenlik Analizi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }

        .header { background: #161b22; border-bottom: 1px solid #21262d; padding: 20px 40px; display: flex; align-items: center; gap: 12px; }
        .header h1 { color: #58a6ff; font-size: 24px; }
        .header span { color: #8b949e; font-size: 14px; }

        .hero { text-align: center; padding: 60px 20px 40px; }
        .hero h2 { font-size: 36px; color: #e6edf3; margin-bottom: 12px; }
        .hero p { color: #8b949e; font-size: 16px; margin-bottom: 40px; }

        .search-box { display: flex; gap: 12px; max-width: 600px; margin: 0 auto; }
        .search-box input {
            flex: 1; padding: 14px 20px; background: #161b22;
            border: 1px solid #30363d; border-radius: 8px;
            color: #e6edf3; font-size: 16px; outline: none;
        }
        .search-box input:focus { border-color: #58a6ff; }
        .search-box button {
            padding: 14px 28px; background: #238636;
            border: none; border-radius: 8px; color: white;
            font-size: 16px; cursor: pointer; font-weight: 600;
            transition: background 0.2s;
        }
        .search-box button:hover { background: #2ea043; }
        .search-box button:disabled { background: #21262d; cursor: not-allowed; }

        .examples { text-align: center; margin-top: 16px; }
        .examples span { color: #8b949e; font-size: 13px; }
        .examples a { color: #58a6ff; font-size: 13px; cursor: pointer; margin: 0 6px; text-decoration: none; }
        .examples a:hover { text-decoration: underline; }

        .loading { text-align: center; padding: 60px; display: none; }
        .loading-spinner { width: 48px; height: 48px; border: 4px solid #21262d; border-top: 4px solid #58a6ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-steps { color: #8b949e; font-size: 14px; }

        .results { max-width: 1000px; margin: 0 auto; padding: 20px 40px 60px; display: none; }

        .score-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .score-number { font-size: 80px; font-weight: 700; line-height: 1; }
        .score-grade { font-size: 24px; font-weight: 600; margin: 8px 0; }
        .score-level { font-size: 16px; color: #8b949e; }
        .score-green { color: #3fb950; }
        .score-yellow { color: #d29922; }
        .score-orange { color: #f0883e; }
        .score-red { color: #f85149; }

        .scores-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 24px; }
        .score-item { background: #0d1117; border-radius: 8px; padding: 12px; text-align: center; }
        .score-item-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
        .score-item-value { font-size: 20px; font-weight: 700; color: #58a6ff; }

        .section { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .section-title { font-size: 16px; font-weight: 600; color: #e6edf3; }
        .section-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #21262d; color: #8b949e; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .info-item { background: #0d1117; border-radius: 8px; padding: 12px; }
        .info-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
        .info-value { font-size: 13px; color: #e6edf3; word-break: break-all; }

        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
        .tag-blue { background: #1f3a5f; color: #58a6ff; }
        .tag-green { background: #1a3a2a; color: #3fb950; }
        .tag-red { background: #3a1a1a; color: #f85149; }
        .tag-yellow { background: #3a2a0a; color: #d29922; }
        .tag-gray { background: #21262d; color: #8b949e; }

        .issue-list { list-style: none; }
        .issue-list li { padding: 8px 12px; background: #3a1a1a; border-radius: 6px; color: #f85149; font-size: 13px; margin-bottom: 6px; }
        .issue-list li::before { content: "⚠ "; }

        .port-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .port-item { padding: 8px 12px; border-radius: 6px; font-size: 12px; }
        .port-safe { background: #1a3a2a; color: #3fb950; }
        .port-danger { background: #3a1a1a; color: #f85149; }

        .error-box { background: #3a1a1a; border: 1px solid #f85149; border-radius: 8px; padding: 20px; text-align: center; color: #f85149; margin: 20px auto; max-width: 600px; }
    </style>
</head>
<body>

<div class="header">
    <span>☁️</span>
    <h1>CloudAudit</h1>
    <span>— Bulut Güvenlik Analiz Platformu</span>
</div>

<div class="hero">
    <h2>Güvenlik Parmak İzini Çıkar</h2>
    <p>Domain veya IP gir, kapsamlı güvenlik analizi al</p>
    <div class="search-box">
        <input type="text" id="domain-input" placeholder="example.com" />
        <button id="scan-btn" onclick="startScan()">Tara</button>
    </div>
    <div class="examples">
        <span>Örnek:</span>
        <a onclick="setDomain('github.com')">github.com</a>
        <a onclick="setDomain('google.com')">google.com</a>
        <a onclick="setDomain('cloudflare.com')">cloudflare.com</a>
    </div>
</div>

<div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-steps" id="loading-text">DNS analizi yapılıyor...</div>
</div>

<div class="results" id="results"></div>

<script>
function setDomain(domain) {
    document.getElementById("domain-input").value = domain;
}

document.getElementById("domain-input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") startScan();
});

const loadingMessages = [
    "DNS analizi yapılıyor...",
    "SSL sertifikası kontrol ediliyor...",
    "Portlar taranıyor...",
    "Cloud altyapısı tespit ediliyor...",
    "Email güvenliği analiz ediliyor...",
    "Güvenlik skoru hesaplanıyor..."
];

async function startScan() {
    const domain = document.getElementById("domain-input").value.trim();
    if (!domain) return;

    document.getElementById("scan-btn").disabled = true;
    document.getElementById("loading").style.display = "block";
    document.getElementById("results").style.display = "none";

    let msgIndex = 0;
    const msgInterval = setInterval(() => {
        document.getElementById("loading-text").textContent = loadingMessages[msgIndex % loadingMessages.length];
        msgIndex++;
    }, 2000);

    try {
        const response = await fetch("/scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ domain })
        });

        const data = await response.json();
        clearInterval(msgInterval);
        document.getElementById("loading").style.display = "none";
        document.getElementById("scan-btn").disabled = false;

        if (data.error) {
            showError(data.error);
            return;
        }

        showResults(data);

    } catch (err) {
        clearInterval(msgInterval);
        document.getElementById("loading").style.display = "none";
        document.getElementById("scan-btn").disabled = false;
        showError("Bağlantı hatası: " + err.message);
    }
}

function showError(message) {
    const results = document.getElementById("results");
    results.style.display = "block";
    results.innerHTML = `<div class="error-box">❌ ${message}</div>`;
}

function getScoreClass(color) {
    return `score-${color}`;
}

function showResults(data) {
    const results = document.getElementById("results");
    results.style.display = "block";

    const s = data.score;
    const scoreClass = getScoreClass(s.color);

    let html = `
        <div class="score-card">
            <div class="score-number ${scoreClass}">${s.total_score}</div>
            <div class="score-grade ${scoreClass}">${s.grade} — ${s.level}</div>
            <div class="score-level">${data.domain} için güvenlik skoru</div>
            <div class="scores-grid">
                <div class="score-item"><div class="score-item-label">DNS</div><div class="score-item-value">${s.scores.dns}</div></div>
                <div class="score-item"><div class="score-item-label">SSL</div><div class="score-item-value">${s.scores.ssl}</div></div>
                <div class="score-item"><div class="score-item-label">PORTLAR</div><div class="score-item-value">${s.scores.ports}</div></div>
                <div class="score-item"><div class="score-item-label">CLOUD</div><div class="score-item-value">${s.scores.cloud}</div></div>
                <div class="score-item"><div class="score-item-label">EMAIL</div><div class="score-item-value">${s.scores.email}</div></div>
            </div>
        </div>`;

    // Sorunlar
    if (s.all_issues.length > 0) {
        html += `<div class="section">
            <div class="section-header">
                <span>⚠️</span>
                <span class="section-title">Tespit Edilen Sorunlar</span>
                <span class="section-badge">${s.all_issues.length} sorun</span>
            </div>
            <ul class="issue-list">
                ${s.all_issues.map(i => `<li>${i}</li>`).join("")}
            </ul>
        </div>`;
    }

    // DNS
    html += `<div class="section">
        <div class="section-header"><span>🌐</span><span class="section-title">DNS Analizi</span><span class="section-badge">Skor: ${data.dns.score}</span></div>
        <div class="info-grid">
            <div class="info-item"><div class="info-label">A Kayıtları</div><div class="info-value">${data.dns.a_records.join(", ") || "Yok"}</div></div>
            <div class="info-item"><div class="info-label">NS Kayıtları</div><div class="info-value">${data.dns.ns_records.slice(0,2).join(", ") || "Yok"}</div></div>
            <div class="info-item"><div class="info-label">SPF</div><div class="info-value">${data.dns.spf ? '<span class="tag tag-green">✓ Var</span>' : '<span class="tag tag-red">✗ Yok</span>'}</div></div>
            <div class="info-item"><div class="info-label">DMARC</div><div class="info-value">${data.dns.dmarc ? '<span class="tag tag-green">✓ Var</span>' : '<span class="tag tag-red">✗ Yok</span>'}</div></div>
            <div class="info-item"><div class="info-label">DNSSEC</div><div class="info-value">${data.dns.dnssec ? '<span class="tag tag-green">✓ Aktif</span>' : '<span class="tag tag-red">✗ Pasif</span>'}</div></div>
            <div class="info-item"><div class="info-label">MX Kayıtları</div><div class="info-value">${data.dns.mx_records.length > 0 ? data.dns.mx_records[0] : "Yok"}</div></div>
        </div>
    </div>`;

    // SSL
    html += `<div class="section">
        <div class="section-header"><span>🔒</span><span class="section-title">SSL Analizi</span><span class="section-badge">Skor: ${data.ssl.score}</span></div>
        <div class="info-grid">
            <div class="info-item"><div class="info-label">HTTPS</div><div class="info-value">${data.ssl.has_ssl ? '<span class="tag tag-green">✓ Aktif</span>' : '<span class="tag tag-red">✗ Yok</span>'}</div></div>
            <div class="info-item"><div class="info-label">Yayıncı</div><div class="info-value">${data.ssl.issuer || "Bilinmiyor"}</div></div>
            <div class="info-item"><div class="info-label">Son Kullanma</div><div class="info-value">${data.ssl.expiry_date || "Bilinmiyor"}</div></div>
            <div class="info-item"><div class="info-label">Kalan Gün</div><div class="info-value">${data.ssl.days_until_expiry !== null ? data.ssl.days_until_expiry + " gün" : "Bilinmiyor"}</div></div>
            <div class="info-item"><div class="info-label">Versiyon</div><div class="info-value">${data.ssl.version || "Bilinmiyor"}</div></div>
            <div class="info-item"><div class="info-label">Cipher</div><div class="info-value">${data.ssl.cipher || "Bilinmiyor"}</div></div>
        </div>
    </div>`;

    // Portlar
    const openPorts = data.ports.open_ports || [];
    html += `<div class="section">
        <div class="section-header"><span>🚪</span><span class="section-title">Port Tarama</span><span class="section-badge">${openPorts.length} açık port</span></div>
        <div class="port-grid">
            ${openPorts.map(p => `
                <div class="port-item ${p.dangerous ? 'port-danger' : 'port-safe'}">
                    ${p.dangerous ? '⚠' : '✓'} ${p.port} — ${p.service}
                </div>
            `).join("") || "<span style='color:#8b949e'>Açık port bulunamadı</span>"}
        </div>
    </div>`;

    // Cloud
    html += `<div class="section">
        <div class="section-header"><span>☁️</span><span class="section-title">Cloud Tespiti</span><span class="section-badge">Skor: ${data.cloud.score}</span></div>
        <div class="info-grid">
            <div class="info-item"><div class="info-label">IP Adresi</div><div class="info-value">${data.cloud.ip || "Bilinmiyor"}</div></div>
            <div class="info-item"><div class="info-label">Cloud Provider</div><div class="info-value">${data.cloud.cloud_provider ? '<span class="tag tag-blue">' + data.cloud.cloud_provider + '</span>' : "Tespit edilemedi"}</div></div>
            <div class="info-item"><div class="info-label">CDN</div><div class="info-value">${data.cloud.cdn ? '<span class="tag tag-blue">' + data.cloud.cdn + '</span>' : "Yok"}</div></div>
            <div class="info-item"><div class="info-label">Server</div><div class="info-value">${data.cloud.server || "Gizli"}</div></div>
            <div class="info-item"><div class="info-label">Güvenlik Header'ları</div><div class="info-value">${Object.keys(data.cloud.security_headers).length} / 7</div></div>
            <div class="info-item"><div class="info-label">Eksik Header'lar</div><div class="info-value">${data.cloud.missing_headers.length > 0 ? data.cloud.missing_headers.length + ' eksik' : '<span class="tag tag-green">Hepsi mevcut</span>'}</div></div>
        </div>
    </div>`;

    // Email
    html += `<div class="section">
        <div class="section-header"><span>📧</span><span class="section-title">Email Güvenliği</span><span class="section-badge">Skor: ${data.email.score}</span></div>
        <div class="info-grid">
            <div class="info-item"><div class="info-label">SPF</div><div class="info-value">${data.email.spf ? '<span class="tag tag-green">✓ Var</span>' : '<span class="tag tag-red">✗ Yok</span>'}</div></div>
            <div class="info-item"><div class="info-label">DMARC</div><div class="info-value">${data.email.dmarc ? '<span class="tag tag-green">✓ Var</span>' : '<span class="tag tag-red">✗ Yok</span>'}</div></div>
            <div class="info-item"><div class="info-label">DKIM</div><div class="info-value">${data.email.dkim_exists ? '<span class="tag tag-green">✓ Tespit edildi</span>' : '<span class="tag tag-yellow">? Tespit edilemedi</span>'}</div></div>
            <div class="info-item"><div class="info-label">MX Kayıtları</div><div class="info-value">${data.email.mx_records.length > 0 ? data.email.mx_records[0] : "Yok"}</div></div>
        </div>
        ${data.email.recommendations.length > 0 ? `
        <div style="margin-top:12px">
            ${data.email.recommendations.map(r => `<div style="padding:6px 10px;background:#1f3a2a;border-radius:6px;color:#3fb950;font-size:12px;margin-bottom:4px">💡 ${r}</div>`).join("")}
        </div>` : ""}
    </div>`;

    results.innerHTML = html;
    results.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
